[package]
name = "mindtree-studio"
version = "0.1.0"
edition = "2021"

[lib]
name = "mindtree_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "mindtree-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
mindtree-native = { path = "../../../packages/native" }
mindtree-tauri-common = { path = "../../../packages/tauri-common/src-rust" }
