name: mindtree_flutter
description: "MindTree adaptive learning engine"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Serialization / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Networking
  http: ^1.2.2

  # Secure storage (API keys)
  flutter_secure_storage: ^9.2.2

  # Math rendering (KaTeX equivalent)
  flutter_math_fork: ^0.7.2

  # Local persistence
  shared_preferences: ^2.3.3

  # Unique IDs
  crypto: ^3.0.6

  # Routing
  go_router: ^14.6.2
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
