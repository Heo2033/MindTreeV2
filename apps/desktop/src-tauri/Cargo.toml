[package]
name = "mindtree-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "mindtree_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "mindtree-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
mindtree-native = { path = "../../../packages/native" }
mindtree-tauri-common = { path = "../../../packages/tauri-common/src-rust" }
